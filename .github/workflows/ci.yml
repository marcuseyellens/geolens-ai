name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Go 测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true
      - name: 全量 Go 测试（含增量 WBS §8 十条验收 + TC-16-01~19）
        run: go test ./...
      - name: Δ-01~Δ-07 §6 静态断言（禁词 / 四数 / host / 工具包装 / 三级标记 / 结果页快照）
        run: go test ./internal/delta/... -run 'TestTC16' -v
      - name: 全站禁词扫描（沿用 A-WP-2 §6）
        run: go test ./internal/aeo/... -run 'TestAcceptance09_NeutralityAndBannedWords|TestEvaluateChecklistAllGreen' -v
      - name: 海外收款回归（供应商模拟、验签、降级、订单归属）
        run: go test ./internal/billing/... ./api/handlers/... -run 'TestProvider|TestAirwallex|TestPayPal|TestHosted|TestPayment|TestCheckout' -v
      - name: 竞品批次回归（TC-C-01~14 / 五处输出面禁令 / 采样分母正交 / flag 正交）
        run: go test ./internal/competitor/... -run 'TestTCC' -v
      - name: 客户可见版回归（TC-F-22/23/8/2/7 / 禁词 / 状态机 / 只读 SQL / 三态 / flag 正交）
        run: go test ./internal/customerfacing/... -run 'TestTCF' -v
      - name: 客户可见版端点与导航（TC-F-01/02/12 / flag off 404 / 六口径 / 固定文案）
        run: go test ./api/handlers/... -run 'TestCustomerFacing|TestAttributionMethodsSix|TestFixedNotices' -v
      - name: SQLite 迁移回滚演练（TC-F-24 / 幂等 / 空启动 / 导航守卫）
        run: go test ./internal/db/... -v
      - name: 七款新品能力回归（TC-D-01~20 / 溯源 ghost / 门禁 / 黑名单 / 双分母 / flag 隔离）
        run: go test ./internal/sevenproducts/... -v
      - name: 七款新品 12 表迁移回滚（TC-D-20 / 幂等 / DB CHECK 不变式 / 逆序删表）
        run: go test ./internal/db/... -run 'TestSeven' -v
      - name: 七款新品端点（flag off 404 / 批准门禁 403-409 / 能力黑名单 / 双分母）
        run: go test ./api/handlers/... -run 'TestSeven' -v
      - name: 后端构建
        run: go build ./...

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    name: Playwright 回归基线
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: L0→L3 关键路径回归
        run: npm run test:e2e
        working-directory: frontend
        env:
          CI: "true"
